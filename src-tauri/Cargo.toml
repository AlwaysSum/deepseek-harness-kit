[package]
name = "dsh-desktop"
version = "0.3.0"
description = "DeepSeek Harness 桌面端：一键部署 / 一键启动 / 一键停止"
authors = ["dsh-desktop"]
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ureq 2.9 pinned; default features = rustls TLS + gzip; proxy-from-env 读取环境代理
ureq = { version = "=2.9.1", features = ["proxy-from-env"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# 远程插件/技能安装：解压 npm tarball(.tgz) 所需
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = "s"
strip = true
