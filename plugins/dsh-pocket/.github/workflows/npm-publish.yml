name: npm publish

# GitHub 打 Release（tag 形如 v0.1.0）即触发：测试 → 版本同步 → 发布 npm。
# 零本地命令；发布后版本号自动提交回仓库。
#
# 首次配置（一次性）：仓库 Settings → Secrets → New repository secret → NPM_TOKEN
# （npmjs.com → Access Tokens → Generate New Token → Automation 类型）

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: 测试
        run: npm test
      - name: 同步版本（tag → package.json）
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "IM_VERSION=$VERSION" >> "$GITHUB_ENV"
          node - "$VERSION" <<'EOF'
          const fs = require('fs');
          const v = process.argv[2];
          const d = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          d.version = v;
          fs.writeFileSync('package.json', JSON.stringify(d, null, 2) + '\n');
          console.log('version ->', v);
          EOF
      - name: 重建依赖树
        run: npm install --no-audit --no-fund
      - name: 发布
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view dsh-pocket@${{ env.IM_VERSION }} version >/dev/null 2>&1; then
            echo "已存在，跳过"
          else
            npm publish
          fi
      - name: 版本同步提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: sync version to ${{ env.IM_VERSION }} (release ${{ github.event.release.tag_name }})"
            git push origin HEAD:main
          fi
