name: 发布 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Windows 安装包由本地 publish-release.ps1 构建并发布（本机为 Windows，产物直接上传 GitHub/GitCode），
  # 避免 tag 触发时重复构建导致同名资产上传冲突，故本作业禁用。
  build-windows:
    name: 构建 Windows（NSIS）
    if: false
    runs-on: windows-latest
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 依赖缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 安装内置插件依赖（dsh-better-sidebar 自带 node_modules，node-pty 等含平台二进制）
        run: npm ci --prefix plugins/dsh-better-sidebar

      - name: 构建并打包（vite + cargo + NSIS）
        run: npm run tauri build

      - name: 上传发布产物（GitHub Releases）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/dsh-desktop.exe
          generate_release_notes: true
          overwrite: true
          fail_on_unmatched_files: true

      - name: 发布到 GitCode Releases
        if: env.GITCODE_TOKEN != ''
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPO: Sunflower816/deepseek-harness-kit
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e
          BASE="https://gitcode.com/api/v5/repos/$GITCODE_REPO"
          # 创建/复用 Release（并发构建场景下创建可能冲突，curl 对非 2xx HTTP 仍返回 0，故不会中断）
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/releases/tags/$TAG?access_token=$GITCODE_TOKEN")
          if [ "$code" = "200" ]; then
            echo "GitCode Release $TAG 已存在"
          else
            curl -sS -X POST "$BASE/releases?access_token=$GITCODE_TOKEN" \
              -F "tag_name=$TAG" -F "name=$TAG" \
              -F "body=自动发布：DeepSeek Harness 桌面端 $TAG" \
              -o /tmp/gitcode-release.json \
              -w "GitCode 创建 Release: HTTP %{http_code}\n"
            echo "GitCode Release $TAG 创建完成"
          fi
          # 上传安装包（预签名 OBS URL + PUT）
          for f in src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/dsh-desktop.exe; do
            [ -f "$f" ] || continue
            fname="$(basename "$f")"
            python - "$GITCODE_TOKEN" "$GITCODE_REPO" "$TAG" "$fname" "$f" <<'PY'
          import json, os, sys, urllib.error, urllib.request
          token, repo, tag, fname, fpath = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
          base = f"https://gitcode.com/api/v5/repos/{repo}"
          with urllib.request.urlopen(f"{base}/releases/{tag}/upload_url?access_token={token}&file_name={fname}") as r:
              data = json.load(r)
          with open(fpath, "rb") as fp:
              body = fp.read()
          req = urllib.request.Request(data["url"], data=body, method="PUT", headers=data["headers"])
          try:
              with urllib.request.urlopen(req) as r:
                  print(f"GitCode 上传 {fname}: HTTP {r.status}")
          except urllib.error.HTTPError as e:
              print(f"GitCode 上传 {fname} 失败: HTTP {e.code} {e.read()[:300]}")
              sys.exit(1)
          PY
          done

  build-linux:
    name: 构建 Linux（deb / 麒麟 / UOS / Ubuntu）
    # 锁定 22.04 作为最旧基线：webkit2gtk-4.1 可用且 glibc 版本更低，
    # 产物可同时运行于 Ubuntu 22.04 / 24.04 与基于 22.04 的麒麟 V10 SP1。
    runs-on: ubuntu-22.04
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 依赖缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装依赖
        run: npm ci

      - name: 安装内置插件依赖（dsh-better-sidebar 自带 node_modules，node-pty 等含平台二进制）
        run: npm ci --prefix plugins/dsh-better-sidebar

      - name: 构建并打包（vite + cargo + deb）
        run: npm run tauri build -- --bundles deb

      - name: 上传发布产物（GitHub Releases）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
          fail_on_unmatched_files: true

      - name: 发布到 GitCode Releases
        if: env.GITCODE_TOKEN != ''
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPO: Sunflower816/deepseek-harness-kit
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e
          BASE="https://gitcode.com/api/v5/repos/$GITCODE_REPO"
          # 创建/复用 Release（并发构建场景下创建可能冲突，curl 对非 2xx HTTP 仍返回 0，故不会中断）
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/releases/tags/$TAG?access_token=$GITCODE_TOKEN")
          if [ "$code" = "200" ]; then
            echo "GitCode Release $TAG 已存在"
          else
            curl -sS -X POST "$BASE/releases?access_token=$GITCODE_TOKEN" \
              -F "tag_name=$TAG" -F "name=$TAG" \
              -F "body=自动发布：DeepSeek Harness 桌面端 $TAG" \
              -o /tmp/gitcode-release.json \
              -w "GitCode 创建 Release: HTTP %{http_code}\n"
            echo "GitCode Release $TAG 创建完成"
          fi
          # 上传 deb 安装包（预签名 OBS URL + PUT）
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            [ -f "$f" ] || continue
            fname="$(basename "$f")"
            python3 - "$GITCODE_TOKEN" "$GITCODE_REPO" "$TAG" "$fname" "$f" <<'PY'
          import json, os, sys, urllib.error, urllib.request
          token, repo, tag, fname, fpath = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
          base = f"https://gitcode.com/api/v5/repos/{repo}"
          with urllib.request.urlopen(f"{base}/releases/{tag}/upload_url?access_token={token}&file_name={fname}") as r:
              data = json.load(r)
          with open(fpath, "rb") as fp:
              body = fp.read()
          req = urllib.request.Request(data["url"], data=body, method="PUT", headers=data["headers"])
          try:
              with urllib.request.urlopen(req) as r:
                  print(f"GitCode 上传 {fname}: HTTP {r.status}")
          except urllib.error.HTTPError as e:
              print(f"GitCode 上传 {fname} 失败: HTTP {e.code} {e.read()[:300]}")
              sys.exit(1)
          PY
          done

  build-macos:
    name: 构建 macOS（dmg）
    # macos-latest 默认 arm64（Apple Silicon）。使用宿主目标构建，--bundles dmg 仅产出 .dmg，
    # 不指定 --target，避免引入额外 target 子目录与跨架构编译复杂度。
    # 产物为未签名 dmg：开源项目可接受，首次打开需在「系统设置 -> 隐私与安全性」放行 Gatekeeper。
    runs-on: macos-latest
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 依赖缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 安装内置插件依赖（dsh-better-sidebar 自带 node_modules，node-pty 等含平台二进制）
        run: npm ci --prefix plugins/dsh-better-sidebar

      - name: 构建并打包（vite + cargo + dmg）
        run: npm run tauri build -- --bundles dmg

      - name: 上传发布产物（GitHub Releases）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true

      - name: 发布到 GitCode Releases
        if: env.GITCODE_TOKEN != ''
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPO: Sunflower816/deepseek-harness-kit
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e
          BASE="https://gitcode.com/api/v5/repos/$GITCODE_REPO"
          # 创建/复用 Release（并发构建场景下创建可能冲突，curl 对非 2xx HTTP 仍返回 0，故不会中断）
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/releases/tags/$TAG?access_token=$GITCODE_TOKEN")
          if [ "$code" = "200" ]; then
            echo "GitCode Release $TAG 已存在"
          else
            curl -sS -X POST "$BASE/releases?access_token=$GITCODE_TOKEN" \
              -F "tag_name=$TAG" -F "name=$TAG" \
              -F "body=自动发布：DeepSeek Harness 桌面端 $TAG" \
              -o /tmp/gitcode-release.json \
              -w "GitCode 创建 Release: HTTP %{http_code}\n"
            echo "GitCode Release $TAG 创建完成"
          fi
          # 上传 dmg 安装包（预签名 OBS URL + PUT）
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] || continue
            fname="$(basename "$f")"
            python3 - "$GITCODE_TOKEN" "$GITCODE_REPO" "$TAG" "$fname" "$f" <<'PY'
          import json, os, sys, urllib.error, urllib.request
          token, repo, tag, fname, fpath = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
          base = f"https://gitcode.com/api/v5/repos/{repo}"
          with urllib.request.urlopen(f"{base}/releases/{tag}/upload_url?access_token={token}&file_name={fname}") as r:
              data = json.load(r)
          with open(fpath, "rb") as fp:
              body = fp.read()
          req = urllib.request.Request(data["url"], data=body, method="PUT", headers=data["headers"])
          try:
              with urllib.request.urlopen(req) as r:
                  print(f"GitCode 上传 {fname}: HTTP {r.status}")
          except urllib.error.HTTPError as e:
              print(f"GitCode 上传 {fname} 失败: HTTP {e.code} {e.read()[:300]}")
              sys.exit(1)
          PY
          done
